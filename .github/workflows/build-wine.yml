name: Build Wine for macOS High Sierra

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-wine:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
      LDFLAGS: "-Wl,-headerpad_max_install_names -Wl,-rpath,/usr/local/lib"

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4          # ✅ Actualizado

      - name: Instalar dependencias
        run: |
          brew install bison mingw-w64 molten-vk sdl2

      - name: Añadir bison al PATH
        run: |
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH

      - name: Clonar Wine
        run: |
          git clone --depth=1 https://github.com/wine-mirror/wine.git

      - name: Configurar Wine (64-bit)
        run: |
          cd wine
          ./configure --enable-win64 \
            --without-alsa \
            --without-capi \
            --without-dbus \
            --without-oss \
            --without-pulse \
            --without-udev \
            --without-v4l2 \
            --without-wayland \
            --without-x

      - name: Compilar
        run: |
          cd wine
          make -j$(sysctl -n hw.ncpu)

      - name: Subir el binario compilado
        uses: actions/upload-artifact@v4    # ✅ Actualizado
        with:
          name: wine-macos-high-sierra
          path: wine/wine
